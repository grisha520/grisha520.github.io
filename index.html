<title>ФинПлан</title>
<style>
/* ---------- темы ---------- */
/* «Полночь» — тёмная по умолчанию (и тема «Авто» в тёмном режиме iPhone) */
:root{
  --bg:#0A0E15; --bg2:#10161F; --card:rgba(20,27,39,.84); --card-solid:#141B27; --card2:#1B2433; --line:#243045;
  --text:#E9EEF7; --muted:#8B98AE; --accent:#5B8CFF; --accent2:#8B5CF6;
  --green:#2BD47D; --red:#FF6464; --amber:#FFB547; --navbg:rgba(10,14,21,.86);
  --hero:linear-gradient(135deg,#2E5BFF 0%,#7B3FF2 100%);
  --blob1:rgba(91,140,255,.20); --blob2:rgba(139,92,246,.18); --glow:rgba(91,92,255,.42);
  --r:18px; color-scheme:dark;
}
/* «Авто» в светлом режиме iPhone */
@media (prefers-color-scheme: light){
  :root{ --bg:#F2F4F8; --bg2:#E9EDF4; --card:rgba(255,255,255,.88); --card-solid:#FFFFFF; --card2:#F1F4F9; --line:#E0E6EF;
    --text:#0E1726; --muted:#66748A; --navbg:rgba(242,244,248,.88);
    --green:#12A866; --red:#E5484D; --amber:#C77A00;
    --blob1:rgba(91,140,255,.14); --blob2:rgba(139,92,246,.12); --glow:rgba(91,92,255,.32); color-scheme:light; }
}
html[data-theme="midnight"]{
  --bg:#0A0E15; --bg2:#10161F; --card:rgba(20,27,39,.84); --card-solid:#141B27; --card2:#1B2433; --line:#243045;
  --text:#E9EEF7; --muted:#8B98AE; --accent:#5B8CFF; --accent2:#8B5CF6;
  --green:#2BD47D; --red:#FF6464; --amber:#FFB547; --navbg:rgba(10,14,21,.86);
  --hero:linear-gradient(135deg,#2E5BFF 0%,#7B3FF2 100%);
  --blob1:rgba(91,140,255,.20); --blob2:rgba(139,92,246,.18); --glow:rgba(91,92,255,.42); color-scheme:dark;
}
html[data-theme="aurora"]{
  --bg:#03121A; --bg2:#071C25; --card:rgba(8,32,42,.80); --card-solid:#0A2430; --card2:#0E2E3A; --line:#164453;
  --text:#E4FFF9; --muted:#7DB4B8; --accent:#00E0A4; --accent2:#00A8FF;
  --green:#3BF0B0; --red:#FF6B81; --amber:#FFC94D; --navbg:rgba(3,18,26,.86);
  --hero:linear-gradient(135deg,#00C896 0%,#00A3FF 55%,#7A5CFF 100%);
  --blob1:rgba(0,224,164,.22); --blob2:rgba(0,150,255,.22); --glow:rgba(0,200,170,.45); color-scheme:dark;
}
html[data-theme="sunset"]{
  --bg:#150911; --bg2:#1E0F19; --card:rgba(40,18,31,.82); --card-solid:#28121F; --card2:#35182B; --line:#4D2339;
  --text:#FFF0F3; --muted:#C894AA; --accent:#FF7A45; --accent2:#FF2E7E;
  --green:#4BE39A; --red:#FF5470; --amber:#FFC24D; --navbg:rgba(21,9,17,.86);
  --hero:linear-gradient(135deg,#FF9A3C 0%,#FF4E6A 50%,#B23CFF 100%);
  --blob1:rgba(255,122,69,.24); --blob2:rgba(255,46,126,.22); --glow:rgba(255,80,110,.48); color-scheme:dark;
}
html[data-theme="neon"]{
  --bg:#07051A; --bg2:#0D0A26; --card:rgba(20,14,52,.80); --card-solid:#140E34; --card2:#1B1446; --line:#2E246A;
  --text:#F4EEFF; --muted:#A79CD8; --accent:#FF2BD6; --accent2:#00E5FF;
  --green:#3DFFB0; --red:#FF4D7D; --amber:#FFD23F; --navbg:rgba(7,5,26,.86);
  --hero:linear-gradient(135deg,#FF2BD6 0%,#7B2BFF 50%,#00E5FF 100%);
  --blob1:rgba(255,43,214,.24); --blob2:rgba(0,229,255,.20); --glow:rgba(255,43,214,.52); color-scheme:dark;
}
html[data-theme="emerald"]{
  --bg:#03110B; --bg2:#071A11; --card:rgba(12,36,25,.82); --card-solid:#0C2419; --card2:#113224; --line:#1D4935;
  --text:#ECFFF4; --muted:#8FBDA3; --accent:#2EE59D; --accent2:#F5C542;
  --green:#46F0A4; --red:#FF6B6B; --amber:#F5C542; --navbg:rgba(3,17,11,.86);
  --hero:linear-gradient(135deg,#0B9E68 0%,#2EE59D 48%,#F5C542 100%);
  --blob1:rgba(46,229,157,.20); --blob2:rgba(245,197,66,.17); --glow:rgba(46,229,157,.45); color-scheme:dark;
}
html[data-theme="ocean"]{
  --bg:#E8F3FF; --bg2:#DCEAFB; --card:rgba(255,255,255,.86); --card-solid:#FFFFFF; --card2:#EDF5FF; --line:#CDDFF5;
  --text:#0A2140; --muted:#58739A; --accent:#0A84FF; --accent2:#00BFD6;
  --green:#0E9F6E; --red:#E5484D; --amber:#C77A00; --navbg:rgba(232,243,255,.88);
  --hero:linear-gradient(135deg,#0A6CFF 0%,#00B4D8 60%,#2ED3A8 100%);
  --blob1:rgba(10,132,255,.20); --blob2:rgba(0,191,214,.18); --glow:rgba(10,132,255,.36); color-scheme:light;
}
html[data-theme="sakura"]{
  --bg:#FFF0F5; --bg2:#FFE3ED; --card:rgba(255,255,255,.86); --card-solid:#FFFFFF; --card2:#FFF1F6; --line:#F6D2E0;
  --text:#3A0F24; --muted:#99607A; --accent:#FF4F8B; --accent2:#A855F7;
  --green:#12A26A; --red:#E0335F; --amber:#C77700; --navbg:rgba(255,240,245,.88);
  --hero:linear-gradient(135deg,#FF6FA3 0%,#FF4F8B 42%,#A855F7 100%);
  --blob1:rgba(255,79,139,.20); --blob2:rgba(168,85,247,.16); --glow:rgba(255,79,139,.40); color-scheme:light;
}
html[data-theme="peach"]{
  --bg:#FFF4EA; --bg2:#FFE8D6; --card:rgba(255,255,255,.86); --card-solid:#FFFFFF; --card2:#FFF2E7; --line:#F4DAC4;
  --text:#3A1C0A; --muted:#9A6C50; --accent:#FF7A2F; --accent2:#FF3D6E;
  --green:#14A06A; --red:#E23D5A; --amber:#C27000; --navbg:rgba(255,244,234,.88);
  --hero:linear-gradient(135deg,#FF9A2E 0%,#FF6A3D 45%,#FF3D6E 100%);
  --blob1:rgba(255,160,61,.24); --blob2:rgba(255,61,110,.16); --glow:rgba(255,110,60,.40); color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--text);
  font:15px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none;background:transparent}
/* цветные «пятна» на фоне — видны сквозь полупрозрачные карточки */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 520px at -5% -8%, var(--blob1), transparent 62%),
    radial-gradient(760px 540px at 108% 22%, var(--blob2), transparent 60%),
    radial-gradient(820px 600px at 40% 115%, var(--blob1), transparent 62%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
a{color:var(--accent)}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 156px)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}

/* ---------- верх ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
.topbar h1{font-size:30px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.025em}
.topbar .h-note{font-size:22px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.tb-r{display:flex;gap:8px}

/* ---------- карточки ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{background:var(--hero);color:#fff;border:0;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-l{font-size:13px;opacity:.8;font-weight:600}
.hero-v{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.hero-s{font-size:13px;opacity:.9;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-f{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-top:8px;gap:8px}
.hero .bar{background:rgba(255,255,255,.22);margin-top:14px}
.hero .bar>i{background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.stat-l{font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.stat-v{font-size:19px;font-weight:750;margin:4px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat-s{font-size:12px;color:var(--muted)}
.stat .bar{margin-top:8px;height:6px}
.sec{font-size:20px;font-weight:780;letter-spacing:-.02em;margin:22px 2px 10px}
.h3{font-size:18px;font-weight:750;letter-spacing:-.015em}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row-sb{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar.ok>i{background:var(--green)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.hero .pill{background:rgba(255,255,255,.18);color:#fff}
.pill.up{color:var(--green)} .pill.down{color:var(--red)}
.hero .pill.up,.hero .pill.down{color:#fff}
.up{color:var(--green)} .down{color:var(--red)} .warn{color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.chip{font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.chip.soft{font-weight:550}
.ms{margin-top:10px;font-weight:650}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:15px;flex:1;min-height:46px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(255,100,100,.14);color:var(--red);border:1px solid rgba(255,100,100,.35)}
.btn.big{width:100%;min-height:54px;font-size:16px;margin-top:10px;flex:none}
.btn:disabled{opacity:.55}
.btn.sm{flex:none;padding:8px 12px;min-height:36px;font-size:13.5px;border-radius:11px}

/* ---------- цели ---------- */
.goal{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.goal-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
.goal-n{font-weight:700} .goal-v{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.goal-f{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}

/* ---------- сегменты ---------- */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:650;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04)}

/* ---------- позиции ---------- */
.pos{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.pos-h{display:flex;align-items:center;gap:8px}
.pos-h b{font-size:16px} .tk{font-size:11.5px;color:var(--muted);font-weight:650;letter-spacing:.03em}
.pos-v{margin-left:auto;font-weight:750;font-variant-numeric:tabular-nums}
.pos-m{font-size:12.5px;color:var(--muted);margin:5px 0 9px;font-variant-numeric:tabular-nums}
.pos-f{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.wbar{position:relative;height:8px;border-radius:99px;background:var(--card2)}
.wfill{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.wtarget{position:absolute;top:-4px;bottom:-4px;width:2.5px;border-radius:2px;background:var(--text);opacity:.85;transform:translateX(-1px)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv div{min-width:0} .kv span{display:block;font-size:12px;color:var(--muted)} .kv b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* ---------- операции ---------- */
.mhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);margin:18px 4px 8px;text-transform:capitalize}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:8px}
.op-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px;background:var(--card2)}
.op-ic.buy{background:rgba(91,140,255,.16)} .op-ic.sell{background:rgba(255,100,100,.14)} .op-ic.div{background:rgba(43,212,125,.15)}
.op-ic.in{background:rgba(43,212,125,.12)} .op-ic.out{background:rgba(255,181,71,.15)}
.op-b{flex:1;min-width:0} .op-t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px}
.empty{text-align:center;color:var(--muted);padding:34px 12px}
.filters{display:flex;gap:6px;overflow-x:auto;margin:-2px -16px 6px;padding:2px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted)}
.filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ---------- таблицы ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:12px}
table.x{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.x th,.x td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}
.x th{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--card2);position:sticky;top:0}
.x tr:last-child td{border-bottom:0}
.x .num{text-align:right}
table.cap{min-width:1180px}
.cap th:first-child,.cap td:first-child{position:sticky;left:0;z-index:2;background:var(--card-solid);box-shadow:1px 0 0 var(--line)}
.cap th:first-child{background:var(--card2);z-index:3}
.cap tbody tr{cursor:pointer}
.cap tfoot td{font-weight:750;background:var(--card2)}
.rk{display:inline-grid;place-items:center;min-width:26px;height:24px;border-radius:7px;font-weight:750;font-size:12.5px}
.tbl-note{font-size:12px;color:var(--muted);margin:-4px 4px 12px}

/* ---------- риски ---------- */
.rrow{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.rbar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden}
.rbar>i{display:block;height:100%;border-radius:99px}
.dist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
summary{font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";float:right;color:var(--muted)}
details[open] summary::after{content:"▴"}

/* ---------- план ---------- */
.month{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;align-items:flex-start}
.month.done{opacity:.62}
.month.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.mdate{width:50px;flex:none;text-align:center;background:var(--card2);border-radius:12px;padding:6px 0}
.mdate b{display:block;font-size:19px;line-height:1.1} .mdate span{font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase}
.mbody{flex:1;min-width:0}
.mbody .chips{margin:4px 0 0}
.mt{font-weight:700;font-size:14.5px}
.mchk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.mchk.on{background:var(--green);border-color:var(--green);color:#06210f}
.year{font-size:13px;font-weight:800;color:var(--muted);margin:18px 4px 8px;letter-spacing:.04em}

/* ---------- графики ---------- */
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{flex:none}
.d-l{font-size:13px;font-weight:800;fill:var(--text)} .d-s{font-size:9.5px;fill:var(--muted);font-weight:600}
.legend{flex:1;min-width:170px;display:grid;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend span.v{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.gantt{display:block;overflow:visible}
.g-tick{font-size:9px;fill:var(--muted);font-weight:600}
.g-grid{stroke:var(--line);stroke-width:1}
.g-today{stroke:var(--red);stroke-width:1.4;stroke-dasharray:3 3}
.g-sec{font-size:10px;font-weight:800;fill:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.g-lbl{font-size:11.5px;fill:var(--text);font-weight:600}
.g-ms{fill:var(--amber)}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:2px;margin:10px 0}
.flow-n{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;text-align:center;font-size:14px}
.flow-a{text-align:center;color:var(--muted)}

/* ---------- заметки (markdown) ---------- */
.md{font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.md h2,.md h3,.md h4,.md h5{letter-spacing:-.015em;margin:22px 0 8px;line-height:1.25}
.md h2{font-size:22px} .md h3{font-size:18.5px} .md h4{font-size:16px}
.md>:first-child{margin-top:0}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0;padding-left:22px} .md li{margin:4px 0}
.md li.l2{margin-left:18px;list-style:circle}
.md code{background:var(--card2);padding:1px 5px;border-radius:6px;font-size:13px}
.md pre.code{background:var(--card2);padding:12px;border-radius:12px;overflow-x:auto;font-size:12.5px}
.md blockquote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--card2);border-radius:0 12px 12px 0}
.md blockquote p{margin:4px 0}

<script>
'use strict';
/* =====================================================================
   ФинПлан — личный финансовый план.
   Все данные хранятся только на этом устройстве, зашифрованные паролем
   (PBKDF2-SHA256 600 000 итераций → AES-256-GCM). Внешних библиотек нет.
   Единственный сетевой запрос — котировки Мосбиржи по нажатию кнопки.
   ===================================================================== */

const VAULT_KEY = 'finplan.vault.v1';
const KDF_ITER = 600000;
const te = new TextEncoder(), td = new TextDecoder();

let S = null;            // расшифрованное состояние (только в памяти)
let KEY = null;          // ключ AES (неизвлекаемый)
let SALT = null, ITER = KDF_ITER;
let PENDING = null;      // данные, ожидающие создания хранилища
let saving = Promise.resolve();
let lastActive = Date.now(), hiddenAt = 0, failCount = 0;
let PRIV = false;        // режим «скрыть суммы»
const UI = { tab:'home', portfolio:'pos', plan:'cal', note:null, opsFilter:'all', showDone:false, calcBudget:null };

/* ---------- утилиты ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const NF = {};
const nf = d => NF[d] || (NF[d] = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: d }));
const fmt = (n, d = 0) => (n == null || !isFinite(n)) ? '—' : nf(d).format(n);
const rub = (n, d = 0) => (n == null || !isFinite(n)) ? '—' : (PRIV ? '••• ₽' : fmt(n, d) + ' ₽');
const sgn = (n, d = 0) => PRIV ? '•••' : (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), d);
const pct = (x, d = 1) => (x == null || !isFinite(x)) ? '—' : fmt(x * 100, d) + '%';
const parseNum = v => {
  if (typeof v === 'number') return v;
  const s = String(v ?? '').replace(/[\s  ]/g, '').replace(',', '.');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
};
const inVal = n => (n == null || n === '' || !isFinite(n)) ? '' : String(Math.round(n * 10000) / 10000).replace('.', ',');
const r2 = n => Math.round(n * 100) / 100;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const pd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const dateRu = s => { if (!s) return '—'; const d = pd(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const dateShort = s => { const d = pd(s); return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`; };
const daysTo = s => Math.round((pd(s) - pd(todayISO())) / 86400000);
const sum = (arr, k) => arr.reduce((t, x) => t + (typeof k === 'function' ? k(x) : (x[k] || 0)), 0);
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const m = n % 10; return (n > 10 && n < 20) ? c : m === 1 ? a : (m >= 2 && m <= 4) ? b : c; };
const asset = id => S.assets.find(a => a.id === id);
const aName = id => { const a = asset(id); return a ? (a.short || a.name) : '—'; };
const unitOf = a => a ? (a.unit || (a.kind === 'stock' ? 'шт' : '₽')) : '';
const PALETTE = ['#5B8CFF','#2BD47D','#FFB547','#FF6464','#A86BFF','#22C1DC','#FF7AB8','#9BD447','#F5C542','#2EC4A6','#FF8A5B','#7C8CFF'];

const KINDS = {
  stock:  { label:'Акции', priced:true },
  broker: { label:'Деньги на брокерском счёте' },
  cash:   { label:'Рубли (счёт / наличные)' },
  fx:     { label:'Валюта', priced:true },
  metal:  { label:'Драгметаллы', priced:true },
  crypto: { label:'Криптовалюта', priced:true },
  income: { label:'Доход (работа)' }
};
const TYPES = ['акции','кэш на бирже','кэш','драгметаллы','криптовалюта','доход'];
const isPriced = a => !!(KINDS[a.kind] && KINDS[a.kind].priced);
const isMoney = a => a.kind === 'broker' || a.kind === 'cash';
const RISKS = [
  ['price','Ценовые'], ['country','Страновые'], ['reg','Регуляторные'], ['biz','Бизнес-риски'],
  ['credit','Кредитные'], ['fx','Валютные'], ['infIssuer','Инфраструктурные (эмитент)'], ['infOwner','Инфраструктурные (владелец)']
];
// Нейтральные значения по умолчанию. Личные цифры приходят только из файла данных пользователя.
const DEFAULT_SETTINGS = { inflation:10, yearGoal:100000, yearGoalLabel:'Цель на конец года', capitalGoal:1000000,
  salary:0, expenses:0, commissionPct:0.3, autoLockMin:5 };
const DEFAULT_LEGEND = {
  categories: [], scale: [[1,'Нет'],[2,'Чуть-чуть'],[3,'Немного'],[4,'Есть'],[5,'Серьёзно'],[6,'Сильно'],[7,'Всё держится на этом риске']]
};

/* ---------- иконки ---------- */
const sv = (p, f) => `<svg class="ic${f ? ' f' : ''}" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const ICON = {
  home: sv('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'),
  pie: sv('<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.4A9 9 0 0 1 20.6 9H15z"/>'),
  table: sv('<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 10h18M3 15h18M9 4v16"/>'),
  cal: sv('<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  more: sv('<circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/>', 1),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  lock: sv('<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  back: sv('<path d="M15 5l-7 7 7 7"/>'),
  close: sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  chev: sv('<path d="M9 5l7 7-7 7"/>'),
  check: sv('<path d="M5 12.5l4.5 4.5L19 7"/>'),
  eye: sv('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  eyeoff: sv('<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.1 6.1A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
  refresh: sv('<path d="M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3"/><path d="M5 3v5h5M19 21v-5h-5"/>')
};
const LOGO = `<svg viewBox="0 0 48 48" fill="none"><rect x="8" y="27" width="7" height="13" rx="2.5" fill="#fff" opacity=".55"/><rect x="20.5" y="19" width="7" height="21" rx="2.5" fill="#fff" opacity=".75"/><rect x="33" y="11" width="7" height="29" rx="2.5" fill="#fff"/><path d="M7 22l12-8 8 5 13-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- шифрование ---------- */
function b64e(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
}
async function encryptJSON(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return { iv: b64e(iv), ct: b64e(new Uint8Array(ct)) };
}
async function decryptJSON(key, iv, ct) {
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64d(iv) }, key, b64d(ct));
  return JSON.parse(td.decode(pt));
}
function readVault() { try { const raw = localStorage.getItem(VAULT_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function hasVault() { return !!readVault(); }
function persist() {
  if (!S || !KEY) return saving;
  const snap = JSON.parse(JSON.stringify(S)), key = KEY, salt = SALT, iter = ITER;
  saving = saving.then(async () => {
    const { iv, ct } = await encryptJSON(key, snap);
    localStorage.setItem(VAULT_KEY, JSON.stringify({ app:'finplan', v:1, kdf:{ alg:'PBKDF2-SHA256', iter, salt: b64e(salt) }, iv, ct }));
  }).catch(e => toast('Не удалось сохранить: ' + (e && e.message || e), true));
  return saving;
}
function normalize(st) {
  st = st || {};
  const o = {
    settings: Object.assign({}, DEFAULT_SETTINGS, st.settings || {}),
    assets: Array.isArray(st.assets) ? st.assets : [],
    ops: Array.isArray(st.ops) ? st.ops : [],
    goals: Array.isArray(st.goals) ? st.goals : [],
    months: Array.isArray(st.months) ? st.months : [],
    baskets: Array.isArray(st.baskets) ? st.baskets : [],
    notes: Array.isArray(st.notes) ? st.notes : [],
    timeline: Array.isArray(st.timeline) ? st.timeline : [],
    phases: Array.isArray(st.phases) ? st.phases : [],
    rules: Array.isArray(st.rules) ? st.rules : [],
    riskLegend: st.riskLegend || DEFAULT_LEGEND,
    meta: Object.assign({ createdAt: new Date().toISOString() }, st.meta || {})
  };
  o.assets.forEach((a, i) => { a.risks = a.risks || {}; if (!a.color) a.color = PALETTE[i % PALETTE.length]; });
  return o;
}
function emptyState() {
  return normalize({ assets: [
    { id:'rubbroker', name:'Рубли (брокер)', short:'Брокерский счёт', type:'кэш на бирже', kind:'broker', unit:'₽', color:'#8B98AE' },
    { id:'rubcash', name:'Рубли (кэш)', short:'Подушка', type:'кэш', kind:'cash', unit:'₽', color:'#22C1DC' }
  ] });
}
function commit(fn, opts) {
  fn(S); S.meta.updatedAt = new Date().toISOString();
  persist(); if (!(opts && opts.noRender)) render();
}

/* ---------- расчёты ---------- */
function positions() {
  const P = {};
  for (const a of S.assets) P[a.id] = { qty:0, cost:0, fees:0, divs:0, realized:0 };
  const touch = id => P[id] || (P[id] = { qty:0, cost:0, fees:0, divs:0, realized:0 });
  const ops = [...S.ops].sort((x, y) => String(x.date).localeCompare(String(y.date)) || (x.ts || 0) - (y.ts || 0));
  const money = (id, delta) => { if (!id || !P[id]) return; P[id].qty += delta; P[id].cost += delta; };
  for (const o of ops) {
    const p = o.assetId ? touch(o.assetId) : null;
    const fee = +o.fee || 0;
    switch (o.type) {
      case 'open': if (p) { p.qty += +o.qty || 0; p.cost += +o.cost || 0; } break;
      case 'buy': { const g = (+o.qty || 0) * (+o.price || 0); if (p) { p.qty += +o.qty || 0; p.cost += g; p.fees += fee; } money(o.source, -(g + fee)); break; }
      case 'sell': {
        if (p) { const q = Math.min(+o.qty || 0, p.qty); const avg = p.qty ? p.cost / p.qty : 0;
          p.realized += ((+o.price || 0) - avg) * q - fee; p.cost -= avg * q; p.qty -= q; p.fees += fee; }
        money(o.source, (+o.qty || 0) * (+o.price || 0) - fee); break;

}

const OPS = {
  buy:      { t:'Покупка', i:'🟦' }, sell: { t:'Продажа', i:'🟥' }, div: { t:'Дивиденды', i:'💰' },
  in:       { t:'Пополнение', i:'⬇️' }, out: { t:'Списание', i:'⬆️' }, transfer: { t:'Перевод', i:'🔁' },
  adjust:   { t:'Корректировка', i:'✏️' }, open: { t:'Начальный остаток', i:'📌' }
};
function opAmount(o) {
  switch (o.type) {
    case 'buy': return -((+o.qty || 0) * (+o.price || 0) + (+o.fee || 0));
    case 'sell': return (+o.qty || 0) * (+o.price || 0) - (+o.fee || 0);
    case 'div': case 'in': case 'transfer': return +o.amount || 0;
    case 'out': return -(+o.amount || 0);
    case 'adjust': return +o.dc || 0;
    case 'open': return +o.cost || 0;
  }
  return 0;
}
function opLine(o) {
  const a = asset(o.assetId), n = a ? (a.short || a.name) : '?', u = unitOf(a);
  switch (o.type) {
    case 'buy': case 'sell': return [`${OPS[o.type].t} · ${n}`, `${fmt(o.qty, 4)} ${u} × ${fmt(o.price, 4)} ₽${o.fee ? ` · комиссия ${fmt(o.fee, 2)} ₽` : ''}`];
    case 'div': return [`Дивиденды · ${n}`, o.source ? `на ${aName(o.source)}` : 'получены'];
    case 'in': return [`Пополнение · ${n}`, o.note || ''];
    case 'out': return [`Списание · ${n}`, o.note || ''];
    case 'transfer': return [`Перевод → ${n}`, `из ${aName(o.source)}`];
    case 'adjust': return [`Корректировка · ${n}`, `${o.dq ? `${sgn(o.dq, 4)} ${u} · ` : ''}${sgn(o.dc || 0, 2)} ₽`];
    case 'open': return [`Остаток · ${n}`, `${isPriced(a || {}) ? `${fmt(o.qty, 4)} ${u} · ` : ''}${o.note || ''}`];
  }
  return [o.type, ''];
}

async function doCreate() {
  const pw = $('#pw').value, pw2 = $('#pw2').value, err = $('#err');
  if (pw.length < 8) { err.textContent = 'Пароль должен быть не короче 8 символов'; return; }
  if (pw !== pw2) { err.textContent = 'Пароли не совпадают'; return; }
  const go = $('#go'); go.disabled = true; go.textContent = 'Шифрование…';
  try {
    SALT = crypto.getRandomValues(new Uint8Array(16)); ITER = KDF_ITER;
    KEY = await deriveKey(pw, SALT, ITER);
    S = normalize(PENDING); PENDING = null;
    await persist(); lastActive = Date.now(); UI.tab = 'home'; render();
    toast('Готово. Данные зашифрованы');
  } catch (e) { err.textContent = 'Ошибка: ' + e.message; go.disabled = false; go.textContent = 'Зашифровать и открыть'; }
}
async function doUnlock() {
  const pw = $('#pw').value, err = $('#err'), go = $('#go'), v = readVault();
  if (!v) { render(); return; }
  if (!pw) { err.textContent = 'Введи пароль'; return; }
  go.disabled = true; go.textContent = 'Расшифровка…';
  try {
    const salt = b64d(v.kdf.salt), key = await deriveKey(pw, salt, v.kdf.iter);
    const st = await decryptJSON(key, v.iv, v.ct);
    SALT = salt; ITER = v.kdf.iter; KEY = key; S = normalize(st); failCount = 0; lastActive = Date.now();
    render();
  } catch (e) {
    failCount++;
    const wait = failCount >= 5 ? Math.min(30, (failCount - 4) * 5) : 0;
    err.textContent = 'Неверный пароль' + (wait ? ` · подожди ${wait} с` : '');
    go.textContent = 'Открыть';
    setTimeout(() => { go.disabled = false; }, wait * 1000);
  }
}

    out.push({ type:'div', assetId: fval('asset'), amount:a, source: fval('source') || null });
  } else if (t === 'in' || t === 'out') {
    const a = parseNum(fval('amount')); if (!(a > 0)) return toast('Укажи сумму', true);
    out.push({ type:t, assetId: fval('asset'), amount:a });
  } else if (t === 'transfer') {
    const a = parseNum(fval('amount')); if (!(a > 0)) return toast('Укажи сумму', true);
    if (fval('source') === fval('asset')) return toast('Счета «откуда» и «куда» совпадают', true);
    out.push({ type:'transfer', assetId: fval('asset'), source: fval('source'), amount:a });
  } else if (t === 'open') {
    out.push({ type:'open', assetId: fval('asset'), qty: parseNum(fval('qty')), cost: parseNum(fval('cost')) });
  } else if (t === 'adjust') {
    const id = fval('asset'), C = calc(), cur = C.byId[id] || { qty:0, cost:0 };
    let base = cur;
    if (editId) { const old = S.ops.find(o => o.id === editId); base = { qty: cur.qty - (+old.dq || 0), cost: cur.cost - (+old.dc || 0) }; }
    const dq = parseNum(fval('nq')) - base.qty, dc = parseNum(fval('nc')) - base.cost;
    if (Math.abs(dq) < 1e-9 && Math.abs(dc) < 0.005) return toast('Значения не изменились', true);
    out.push({ type:'adjust', assetId:id, dq: Math.round(dq * 1e6) / 1e6, dc: r2(dc) });
  }
  const markDone = monthId && fval('markdone');
  commit(s => {
    if (editId) { const i = s.ops.findIndex(o => o.id === editId); if (i >= 0) s.ops[i] = Object.assign({ id: editId, ts: s.ops[i].ts }, out[0], { date, note }); }
    else out.forEach((o, k) => { const n = o._note || note; delete o._note; s.ops.push(Object.assign({ id: uid(), ts: Date.now() + k, date, note: n }, o)); });
    if (markDone) { const m = s.months.find(x => x.id === monthId); if (m) m.done = true; }
  });
  closeSheet();
  toast(editId ? 'Сохранено' : out.length > 1 ? `Записано операций: ${out.length}` : 'Записано');
}

async function fetchMoex() {
  const btn = $('#moexbtn'); if (btn) { btn.disabled = true; btn.textContent = 'Загрузка…'; }
  const stocks = S.assets.filter(a => a.kind === 'stock' && a.ticker), fx = S.assets.filter(a => ['fx', 'metal'].includes(a.kind) && /_TOM$|_TOD$/.test(a.ticker || ''));
  const got = {};
  const q = async (url, list) => {
    if (!list.length) return;
    const j = await (await fetch(url, { credentials: 'omit', referrerPolicy: 'no-referrer', cache: 'no-store' })).json();
    const md = j.marketdata, sc = j.securities;
    const mc = n => md.columns.indexOf(n), scn = n => sc.columns.indexOf(n);
    md.data.forEach(r => { const v = r[mc('LAST')] ?? r[mc('LCURRENTPRICE')] ?? r[mc('MARKETPRICE')]; if (v) got[r[mc('SECID')]] = Object.assign(got[r[mc('SECID')]] || {}, { price: v }); });
    sc.data.forEach(r => { const id = r[scn('SECID')]; got[id] = Object.assign(got[id] || {}, { prev: r[scn('PREVPRICE')], lot: scn('LOTSIZE') >= 0 ? r[scn('LOTSIZE')] : undefined }); });
  };
  try {
    await q(`https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities.json?iss.meta=off&iss.only=marketdata,securities&securities=${stocks.map(a => encodeURIComponent(a.ticker)).join(',')}&marketdata.columns=SECID,LAST,LCURRENTPRICE,MARKETPRICE&securities.columns=SECID,PREVPRICE,LOTSIZE`, stocks);
    await q(`https://iss.moex.com/iss/engines/currency/markets/selt/boards/CETS/securities.json?iss.meta=off&iss.only=marketdata,securities&securities=${fx.map(a => encodeURIComponent(a.ticker)).join(',')}&marketdata.columns=SECID,LAST,MARKETPRICE,LCURRENTPRICE&securities.columns=SECID,PREVPRICE`, fx);
    const d = todayISO(); let n = 0;
    commit(s => s.assets.forEach(a => { const g = a.ticker && got[a.ticker]; if (!g) return; const v = g.price || g.prev; if (v) { a.price = v; a.priceDate = d; n++; } if (g.lot && a.kind === 'stock') a.lot = g.lot; }), { noRender: true });
    render(); openPrices(); toast(n ? `Обновлено цен: ${n}` : 'Мосбиржа не вернула цены', !n);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.innerHTML = `${ICON.refresh} Загрузить с Мосбиржи`; }
    toast('Не удалось связаться с Мосбиржей', true);
  }
}

const H = {
  tab: el => { UI.tab = el.dataset.tab; UI.note = null; render(); scrollTo(0, 0); },
  tabto: el => { UI.tab = el.dataset.tab; if (el.dataset.sub) UI.portfolio = el.dataset.sub; render(); scrollTo(0, 0); },
  seg: el => { UI[el.dataset.page] = el.dataset.v; render(); },
  priv: () => { PRIV = !PRIV; render(); },
  lock: () => lock(),
  fab: () => openOp('buy'),
  optype: el => openOp(el.dataset.v),
  saveop: () => saveOp(),
  editop: el => { const op = S.ops.find(o => o.id === el.dataset.id); if (op) openOp(op.type, { op }); },
  delop: () => { $('#delzone').innerHTML = `<div class="confirm">Удалить операцию? Позиции пересчитаются.<div class="btns"><button class="btn danger" data-act="delopyes">Удалить</button><button class="btn ghost" data-act="closesheet">Отмена</button></div></div>`; },
  delopyes: () => { const id = sheetRoot().dataset.edit; commit(s => { s.ops = s.ops.filter(o => o.id !== id); }); closeSheet(); toast('Удалено'); },
  opsf: el => { UI.opsFilter = el.dataset.v; render(); },
  asset: el => openAsset(el.dataset.id),
  editasset: el => openAssetEdit(el.dataset.id),
  addasset: () => openAssetEdit(null),
  saveasset: el => saveAsset(el.dataset.id || null),
  delasset: el => { $('#delzone').innerHTML = `<div class="confirm">Удалить актив?<div class="btns"><button class="btn danger" data-act="delassetyes" data-id="${esc(el.dataset.id)}">Удалить</button><button class="btn ghost" data-act="closesheet">Отмена</button></div></div>`; },
  delassetyes: el => { commit(s => { s.assets = s.assets.filter(a => a.id !== el.dataset.id); }); closeSheet(); toast('Удалено'); },
  quickbuy: el => openOp('buy', { preset: { [el.dataset.id]: (+asset(el.dataset.id).lot || 1) } }),
  prices: () => openPrices(),
  saveprices: () => savePrices(),
  moex: () => fetchMoex(),
  month: el => openMonth(el.dataset.id),
  addmonth: () => openMonth(null),
  savemonth: el => saveMonth(el.dataset.id || null),
  delmonth: el => { $('#delzone').innerHTML = `<div class="confirm">Удалить шаг плана?<div class="btns"><button class="btn danger" data-act="delmonthyes" data-id="${esc(el.dataset.id)}">Удалить</button><button class="btn ghost" data-act="closesheet">Отмена</button></div></div>`; },
  delmonthyes: el => { commit(s => { s.months = s.months.filter(m => m.id !== el.dataset.id); }); closeSheet(); },
  monthdone: el => { commit(s => { const m = s.months.find(x => x.id === el.dataset.id); if (m) m.done = !m.done; }); },
  monthbuy: el => { const m = S.months.find(x => x.id === el.dataset.id); if (m && m.basket) openOp('buy', { preset: m.basket, monthId: m.id }); },
  basketbuy: el => { const b = S.baskets.find(x => x.id === el.dataset.id); if (b) openOp('buy', { preset: b.items }); },
  showdone: () => { UI.showDone = !UI.showDone; render(); },
  calcrecord: () => { const r = suggest(UI.calcBudget || 0, calc()); const preset = {}, prices = {}; r.rows.forEach(x => { preset[x.id] = x.qty; prices[x.id] = x.price; }); openOp('buy', { preset, prices }); },
  note: el => { UI.tab = 'more'; UI.note = el.dataset.note; closeSheet(); render(); scrollTo(0, 0); },
  noteback: () => { UI.note = null; render(); },
  settings: () => openSettings(),
  themes: () => openThemes(),
  settheme: el => { applyTheme(el.dataset.v, true); openThemes(); },
  savesettings: () => { commit(s => { ['inflation','commissionPct','salary','expenses','capitalGoal','yearGoal','autoLockMin'].forEach(k => { s.settings[k] = parseNum(fval(k)); }); s.settings.yearGoalLabel = (fval('yearGoalLabel') || '').trim() || 'Цель на год'; if (!(s.settings.autoLockMin > 0)) s.settings.autoLockMin = 5; }); closeSheet(); toast('Сохранено'); },
  chpw: () => openChangePw(),
  savepw: () => changePw(),
  wipe: () => openWipe(),
  forgot: () => openWipe(true),
  dowipe: () => { if ((fval('confirmw') || '').trim().toUpperCase() !== 'УДАЛИТЬ') return toast('Напиши слово УДАЛИТЬ', true); try { localStorage.removeItem(VAULT_KEY); } catch (e) {} S = null; KEY = null; PENDING = null; closeSheet(); render(); toast('Данные стёрты'); },
  export: () => exportBackup(),
  csv: () => openCsvWarn(),
  docsv: () => { closeSheet(); exportCsv(); },
  import: () => { const f = $('#file-in'); f.value = ''; f.click(); },
  startempty: () => { PENDING = emptyState(); render(); },
  cancelsetup: () => { PENDING = null; render(); },
  create: () => doCreate(),
  unlock: () => doUnlock(),
  seedplan: () => { const o = sheetRoot()._seed; commit(s => { ['notes','months','baskets','timeline','phases','rules','goals'].forEach(k => { if (Array.isArray(o[k])) s[k] = o[k]; }); if (o.riskLegend) s.riskLegend = o.riskLegend; if (o.settings && o.settings.capitalGoal) s.settings.capitalGoal = o.settings.capitalGoal; }); closeSheet(); toast('Заметки и план обновлены'); },
  seedall: () => { const o = sheetRoot()._seed; S = normalize(o); persist(); closeSheet(); render(); toast('Данные заменены'); },
  restorevault: async () => {
    const v = sheetRoot()._vault, btn = $('#rvbtn'); btn.disabled = true; btn.textContent = 'Расшифровка…';
    try { const st = await decryptJSON(await deriveKey(fval('bpw'), b64d(v.kdf.salt), v.kdf.iter), v.iv, v.ct); S = normalize(st); await persist(); closeSheet(); render(); toast('Восстановлено'); }
    catch (e) { btn.disabled = false; btn.textContent = 'Восстановить'; toast('Неверный пароль копии', true); }
  },
  closesheet: () => closeSheet(),
  sheetbg: (el, e) => { if (e.target === el) closeSheet(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const h = H[el.dataset.act]; if (!h) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.act !== 'sheetbg') e.stopPropagation();
  h(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'calc-budget') { UI.calcBudget = parseNum(t.value); updCalc(); return; }
  const root = sheetRoot(); if (!root || !root.contains(t)) return;
  if (root.dataset.type === 'buy' && t.name) {
    if (t.name === 'topup') { updBuyTotals(); return; }
    const m = t.name.match(/^([qpf])_(.+)$/);
    if (m) {
      const id = m[2];
      if (m[1] === 'f') t.dataset.manual = '1';
      else { const fe = root.querySelector(`[name="f_${CSS.escape(id)}"]`); if (fe && !fe.dataset.manual) { const q = parseNum(fval('q_' + id)), p = parseNum(fval('p_' + id)); fe.value = q > 0 && p > 0 ? inVal(r2(q * p * (+S.settings.commissionPct || 0) / 100)) : ''; } }
    }
    updBuyTotals();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'infl' && S) { const v = parseNum(t.value); commit(s => { s.settings.inflation = v; }); return; }
  if (t.id === 'file-in' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => handleImport(String(r.result)); r.onerror = () => toast('Не удалось прочитать файл', true); r.readAsText(t.files[0]); return; }
  const root = sheetRoot();
  if (root && root.contains(t)) {
    if (t.name === 'source' && root.dataset.type === 'buy') updBuyTotals();
    if (t.name === 'asset' && (root.dataset.type === 'buyfx' || root.dataset.type === 'sell')) { const a = asset(t.value), p = root.querySelector('[name="price"]'); if (a && p && !p.value) p.value = inVal(a.price); }
    if (t.name === 'asset' && root.dataset.type === 'adjust') { const c = calc().byId[t.value]; if (c) { root.querySelector('[name="nq"]').value = inVal(c.qty); root.querySelector('[name="nc"]').value = inVal(r2(c.cost)); } }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'pw' || e.target.id === 'pw2')) { e.preventDefault(); (S ? null : hasVault() && !PENDING ? doUnlock() : doCreate()); }
  if (e.key === 'Escape') closeSheet();
});

/* ---------- автоблокировка ---------- */
['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));
setInterval(() => { if (S && Date.now() - lastActive > (S.settings.autoLockMin || 5) * 60000) lock(); }, 10000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); if (S) persist(); }
  else if (S && hiddenAt && Date.now() - hiddenAt > 60000) lock();
});

/* ---------- оформление ---------- */
// Тема — не личные данные: хранится открыто, чтобы применяться уже на экране входа.
const THEME_KEY = 'finplan.theme';
const THEMES = [
  { id:'auto',     name:'Авто',    sub:'как в iPhone',         bg:'linear-gradient(135deg,#0A0E15 50%,#F2F4F8 50%)', card:'rgba(127,127,127,.35)', hero:'linear-gradient(135deg,#2E5BFF,#7B3FF2)', a:'#5B8CFF', b:'#8B5CF6' },
  { id:'midnight', name:'Полночь', sub:'синий · фиолетовый',   bg:'#0A0E15', card:'#1B2433', hero:'linear-gradient(135deg,#2E5BFF,#7B3FF2)', a:'#5B8CFF', b:'#8B5CF6' },
  { id:'aurora',   name:'Аврора',  sub:'бирюза · лазурь',      bg:'#03121A', card:'#0E2E3A', hero:'linear-gradient(135deg,#00C896,#00A3FF 55%,#7A5CFF)', a:'#00E0A4', b:'#00A8FF' },
  { id:'sunset',   name:'Закат',   sub:'оранжевый · розовый',  bg:'#150911', card:'#35182B', hero:'linear-gradient(135deg,#FF9A3C,#FF4E6A 50%,#B23CFF)', a:'#FF7A45', b:'#FF2E7E' },
  { id:'neon',     name:'Неон',    sub:'маджента · циан',      bg:'#07051A', card:'#1B1446', hero:'linear-gradient(135deg,#FF2BD6,#7B2BFF 50%,#00E5FF)', a:'#FF2BD6', b:'#00E5FF' },
  { id:'emerald',  name:'Изумруд', sub:'зелень · золото',      bg:'#03110B', card:'#113224', hero:'linear-gradient(135deg,#0B9E68,#2EE59D 48%,#F5C542)', a:'#2EE59D', b:'#F5C542' },
  { id:'ocean',    name:'Океан',   sub:'светлая · голубая',    bg:'#E8F3FF', card:'#FFFFFF', hero:'linear-gradient(135deg,#0A6CFF,#00B4D8 60%,#2ED3A8)', a:'#0A84FF', b:'#00BFD6' },
  { id:'sakura',   name:'Сакура',  sub:'светлая · розовая',    bg:'#FFF0F5', card:'#FFFFFF', hero:'linear-gradient(135deg,#FF6FA3,#FF4F8B 42%,#A855F7)', a:'#FF4F8B', b:'#A855F7' },
  { id:'peach',    name:'Персик',  sub:'светлая · тёплая',     bg:'#FFF4EA', card:'#FFFFFF', hero:'linear-gradient(135deg,#FF9A2E,#FF6A3D 45%,#FF3D6E)', a:'#FF7A2F', b:'#FF3D6E' }
];
function currentTheme() { try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme(id, save) {
  const t = THEMES.some(x => x.id === id) ? id : 'auto';
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  if (save) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta && bg) meta.setAttribute('content', bg);
}
function openThemes() {
  const cur = currentTheme();
  openSheet('Оформление', `<div class="themes">${THEMES.map(t => `<button class="th ${t.id === cur ? 'on' : ''}" data-act="settheme" data-v="${t.id}" aria-label="Тема ${esc(t.name)}">
      <div class="th-pv" style="background:${t.bg}"><div class="th-hero" style="background:${t.hero}"></div>
        <div class="th-row"><i style="background:${t.card}"></i><i style="background:${t.card}"></i></div>
        <div class="th-row"><i style="background:${t.a}"></i><i style="background:${t.b}"></i></div></div>
      ${t.id === cur ? `<span class="th-ok">${ICON.check}</span>` : ''}
      <div class="th-n">${esc(t.name)}</div><div class="th-s">${esc(t.sub)}</div></button>`).join('')}</div>
    <div class="note-hint" style="margin-top:12px">Тема хранится на этом устройстве без шифрования — в ней нет личных данных. Поэтому она видна уже на экране входа.</div>`);
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => applyTheme(currentTheme(), false));

/* ---------- уведомления ---------- */
let toastT = null;
function toast(msg, err) {
  const el = $('#toast'); el.innerHTML = `<div class="toast ${err ? 'err' : ''}">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT = setTimeout(() => { el.innerHTML = ''; }, err ? 3600 : 2200);
}

/* ---------- запуск ---------- */
if (!window.crypto || !crypto.subtle) {
  document.getElementById('app').innerHTML = '<div class="gate"><h1>Нужен защищённый адрес</h1><p>Шифрование работает только по https:// (или на localhost). Открой приложение по защищённой ссылке.</p></div>';
} else {
  applyTheme(currentTheme(), false);
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
